# The west manifest file (west.yml) for the hpmicro SDK.
#
# Get sources from gitee
#

########################################
##  zephyr                    v3.7.0  ##
##  hpm_sdk                   v1.10.0 ##
########################################
manifest:
  version: "1.0"

  remotes:
    - name: test
      url-base: git@192.168.11.211:oss
    - name: gitee
      url-base: https://gitee.com/hpmicro
    - name: cherry-embedded
      url-base: https://gitee.com/sakumisu
    - name: gitee-zephyr
      url-base: https://gitee.com/zephyr-rtos

  defaults:
    remote: gitee

  projects:
    - name: zephyr
      repo-path: zephyr
      revision: zsg_v0.6.0
      import:
        name-allowlist:
          - west-commands
    - name: sdk_env
      repo-path: sdk_env
      path: sdk_env
      revision: v1.10.0
      submodules: true
    - name: canopennode
      repo-path: canopennode
      path: modules/lib/canopennode
      revision: dec12fa3f0d790cafa8414a4c2930ea71ab72ffd
    - name: CherryUSB
      remote: cherry-embedded
      repo-path: CherryUSB
      path: modules/lib/CherryUSB
      revision: f3b5025b646727412864d06aff59c6d0fa4a4079
    - name: fatfs
      repo-path: fatfs
      path: modules/fs/fatfs
      revision: 427159bf95ea49b7680facffaa29ad506b42709b
    - name: mcuboot
      repo-path: mcuboot
      revision: 97699e0df63825ad29b8d78beccf1c93e45c97bb
      path: bootloader/mcuboot
    - name: mbedtls
      repo-path: mbedtls
      revision: 2f24831ee13d399ce019c4632b0bcd440a713f7c
      path: modules/crypto/mbedtls
      groups:
        - crypto
      remote: gitee-zephyr

  # West-related configuration for the sdk_glue repository.
  self:
    path: sdk_glue
    west-commands: scripts/west-commands.yml
