# Docker Compose configuration for Zephyr HPMicro development environment
# 
# Two versions available:
# - zephyr-remote: Downloads repositories from remote (larger image)
# - zephyr-local: Source code embedded in image, SDK mounted from host (recommended)

services:
  # ==========================================================================
  # LOCAL VERSION (Recommended)
  # ==========================================================================
  # Source code is embedded in the image for faster builds
  # Zephyr SDK is mounted from host to keep image small
  # SDK is mounted at ${WORKSPACE}/zephyr-sdk-X.X.X (same level as sdk_glue)
  #
  zephyr-local:
    build:
      context: ..
      dockerfile: sdk_glue/dockerfile.local
      args:
        USER_UID: ${USER_UID:-1000}
        USER_GID: ${USER_GID:-1000}
        CMAKE_VERSION: ${CMAKE_VERSION:-3.28.3}
        ZEPHYR_SDK_VERSION: ${ZEPHYR_SDK_VERSION:-0.16.5}
    image: zephyr_hpmicro:local
    container_name: zephyr-local
    volumes:
      # Mount Zephyr SDK to workspace (same level as sdk_glue, zephyr, etc.)
      # The SDK will be at /home/zephyr/zephyr_space/zephyr-sdk-0.16.5
      # IMPORTANT: Update ZEPHYR_SDK_PATH to your local zephyr-sdk location
      - ${ZEPHYR_SDK_PATH:-../zephyr-sdk-0.16.5-1}:/home/zephyr/zephyr_space/zephyr-sdk-${ZEPHYR_SDK_VERSION:-0.16.5}
      
      # Optional: Mount build output directory for persistence
      # - ./build:/home/zephyr/zephyr_space/build
      
    working_dir: /home/zephyr/zephyr_space
    stdin_open: true
    tty: true
    
    # Serial device access for flashing and debugging
    devices:
      # CMSIS-DAP debugger (FireDAP example)
      - /dev/serial/by-id/usb-Embedfire_fireDAP_CMSIS-DAP_4e7209d75d71e89c-if00:/dev/ttyDAP
      # Common USB-to-Serial adapters (uncomment as needed):
      # - /dev/ttyUSB0:/dev/ttyUSB0
      # - /dev/ttyACM0:/dev/ttyACM0
    
    privileged: false
    
    group_add:
      - dialout
    
    networks:
      - zephyr-network
    
    environment:
      - WORKSPACE=/home/zephyr/zephyr_space
      - ZEPHYR_TOOLCHAIN_VARIANT=zephyr
      - ZEPHYR_SDK_VERSION=${ZEPHYR_SDK_VERSION:-0.16.5}
      - WEST_MANIFEST=${WEST_MANIFEST:-west_gitee.yml}
    
    profiles:
      - local

  # ==========================================================================
  # REMOTE VERSION
  # ==========================================================================
  # Downloads all repositories from remote sources
  # Use this when you want a clean environment from scratch
  #
  zephyr-remote:
    build:
      context: ..
      dockerfile: sdk_glue/dockerfile.remote
      args:
        USER_UID: ${USER_UID:-1000}
        USER_GID: ${USER_GID:-1000}
        CMAKE_VERSION: ${CMAKE_VERSION:-3.28.3}
        ZEPHYR_SDK_VERSION: ${ZEPHYR_SDK_VERSION:-0.16.5}
    image: zephyr_hpmicro:remote
    container_name: zephyr-remote
    volumes:
      - ..:/home/zephyr/zephyr_space
      # Optional: Mount SDK from host
      # - ${ZEPHYR_SDK_PATH:-../zephyr-sdk-0.16.5-1}:/home/zephyr/zephyr_space/zephyr-sdk-${ZEPHYR_SDK_VERSION:-0.16.5}
    working_dir: /home/zephyr/zephyr_space
    stdin_open: true
    tty: true
    devices:
      - /dev/serial/by-id/usb-Embedfire_fireDAP_CMSIS-DAP_4e7209d75d71e89c-if00:/dev/ttyDAP
      # - /dev/ttyUSB0:/dev/ttyUSB0
      # - /dev/ttyACM0:/dev/ttyACM0
    privileged: false
    group_add:
      - dialout
    networks:
      - zephyr-network
    environment:
      - WORKSPACE=/home/zephyr/zephyr_space
      - ZEPHYR_TOOLCHAIN_VARIANT=zephyr
    profiles:
      - remote

networks:
  zephyr-network:
    driver: bridge

# =============================================================================
# USAGE INSTRUCTIONS
# =============================================================================
#
# PREREQUISITES:
# 1. Set your Zephyr SDK path:
#    export ZEPHYR_SDK_PATH=/path/to/your/zephyr-sdk-0.16.5
#
# 2. Make sure your user can access serial devices:
#    sudo usermod -aG dialout $USER
#    (logout and login again for changes to take effect)
#
# BUILD LOCAL VERSION (recommended - use the build script):
#   cd /path/to/ZSG/sdk_glue
#   ./docker-build.sh local
#   # Or with additional options:
#   ./docker-build.sh local --no-cache
#
# ALTERNATIVE BUILD (without script):
#   # First copy .dockerignore to ZSG root, then build:
#   cp .dockerignore ../
#   docker-compose --profile local build zephyr-local
#   rm ../.dockerignore
#
# START LOCAL CONTAINER:
#   docker-compose --profile local up -d zephyr-local
#
# ENTER CONTAINER:
#   docker-compose --profile local exec zephyr-local /bin/bash
#
# INSIDE CONTAINER - Build and flash:
#   west build -b hpm6750evkmini samples/basic/blinky
#   west flash
#
# ONE-LINER (start and enter):
#   docker-compose --profile local up -d && docker-compose --profile local exec zephyr-local /bin/bash
#
# STOP CONTAINER:
#   docker-compose --profile local down
#
# =============================================================================
# DIRECTORY STRUCTURE IN CONTAINER
# =============================================================================
#
# /home/zephyr/zephyr_space/          <- WORKSPACE
#   ├── bootloader/                   <- (embedded in image)
#   ├── docs/                         <- (embedded in image)
#   ├── modules/                      <- (embedded in image)
#   ├── sdk_env/                      <- (embedded in image)
#   ├── sdk_glue/                     <- (embedded in image)
#   ├── tools/                        <- (embedded in image)
#   ├── zephyr/                       <- (embedded in image)
#   └── zephyr-sdk-0.16.5/            <- (mounted from host at runtime)
#
# =============================================================================
# TROUBLESHOOTING
# =============================================================================
#
# Q: Cannot access serial device?
# A: 1. Check device exists: ls -la /dev/ttyUSB* /dev/ttyACM* /dev/serial/by-id/
#    2. Update 'devices' section with correct device path
#    3. Try setting privileged: true temporarily
#
# Q: Build fails saying SDK not found?
# A: 1. Check ZEPHYR_SDK_PATH environment variable is set correctly
#    2. Verify SDK directory exists and contains sdk_version file
#    3. Try absolute path: export ZEPHYR_SDK_PATH=/absolute/path/to/sdk
#
# Q: Permission denied errors?
# A: 1. Check USER_UID and USER_GID match your host user
#    2. Run: id (to see your UID/GID)
#    3. Set in .env file or export before running docker-compose
#
# Q: Image too large / zephyr-sdk being copied?
# A: Make sure to use ./docker-build.sh which handles .dockerignore correctly
#
# Q: SDK setup.sh fails?
# A: The entrypoint runs setup.sh automatically. Check container logs:
#    docker-compose --profile local logs zephyr-local
#
# =============================================================================
